name: weekly-signal

on:
  push:
    branches: [main]
  schedule:
    # 每周五 16:35（北京时间），A 股收盘后
    - cron: '35 8 * * 5'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: '部署前更新行情和信号'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        if: github.event_name == 'schedule' || inputs.refresh_data
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        if: github.event_name == 'schedule' || inputs.refresh_data
        run: pip install -r requirements.txt

      - name: Refresh prices
        if: github.event_name == 'schedule' || inputs.refresh_data
        run: python scripts/fetch_prices.py

      - name: Build signal data
        if: github.event_name == 'schedule' || inputs.refresh_data
        run: python scripts/build_data.py

      - name: Commit data
        if: github.event_name == 'schedule' || inputs.refresh_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/public/data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "chore(data): weekly signal $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app deps
        working-directory: app
        run: npm ci

      - name: Build PWA
        working-directory: app
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
